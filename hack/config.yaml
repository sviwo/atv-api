# CLI tool, only in development environment.
# https://goframe.org/pages/viewpage.action?pageId=3673173
# 工具相关配置
gfcli:
  # 工具编译/项目打包配置
  build:
    name: "sviwo-api"
    arch: "amd64"
    system: "linux"
    mod: ""
    cgo: 0
    packSrc: "manifest/config/config.yaml,manifest/i18n"
    output: "manifest/docker/sviwo/bin/sviwo-api"

  # dao生成
  gen:
    dao:
      - link: "mysql:root:1qaz2wsx@tcp(server.sviwo.cn:33306)/sviwo"
        descriptionTag: true
        noModelComment: true
        withTime: true
        removePrefix: "sw_"